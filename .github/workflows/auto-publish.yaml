name: Auto Publish From Upstream

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: Update to latest Beszel release
    runs-on: ubuntu-latest
    permissions:
      contents: write # To push the version bump
      actions: write # To start the publish workflow
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Check for latest release version
        id: get_version
        run: |
          latest=$(gh api repos/henrygd/beszel/releases/latest --jq '.tag_name')
          latest=${latest#v}
          if [[ -z "${latest}" ]]; then
            echo "::error::Failed to detect latest Beszel release"
            exit 1
          fi
          current=$(yq -r '.version' beszel-agent/config.yaml)
          echo "Latest Beszel release: ${latest}"
          echo "  Add-on version: ${current}"
          if [[ "${current}" != "${latest}" ]]; then
            echo "New version detected: ${latest}"
            echo "version=${latest}" >> "$GITHUB_OUTPUT"
          else
            echo "No version change"
          fi

      - name: Update to latest release version
        if: steps.get_version.outputs.version
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          sed -i "s/^version: *\".*\"/version: \"${VERSION}\"/" beszel-agent/config.yaml
          today=$(TZ=America/Chicago date +%Y-%m-%d)
          sed -i "1i ## [${VERSION}] - ${today}\n\n### Updated\n\n- Updated Beszel Agent to v${VERSION}\n" beszel-agent/CHANGELOG.md

      - name: Commit changes
        if: steps.get_version.outputs.version
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          git config user.name "duff-robot"
          git config user.email "matthew.hadley+duff-robot@gmail.com"
          git add beszel-agent/config.yaml beszel-agent/CHANGELOG.md
          git commit -m "auto-update to v${VERSION}"
          git push

      # Pushes made with GITHUB_TOKEN don't trigger workflows, so start the
      # publish explicitly; it checks out the commit just pushed.
      - name: Publish
        if: steps.get_version.outputs.version
        run: gh workflow run publish-on-version-bump.yaml --ref "${GITHUB_REF_NAME}"
